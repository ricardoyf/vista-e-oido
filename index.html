function setup(){const active=state.quiz&&state.quiz.phase!=='results';return `<section class="surface setup"><p class="eyebrow">${u('step')} ${state.level} · ${levelName(state.level)}</p><h2>${u('roundTitle')}</h2><p class="muted">${u('roundSub')}</p>${state.quiz?.phase==='results'?actButton(u('lastResult'),'resume','','subtle'):''}${active?`<div class="setup-notice"><p>${u('replaceRound')}</p>${actButton(u('resume'),'resume','','subtle')}</div>`:''}<div class="setup-row"><h3>${u('mode')}</h3><div class="choices">${['practice','exam'].map(m=>actButton(`<strong>${m==='practice'?'✦':'▤'} ${u(m)}</strong><small>${u(m+'Hint')}</small>`,'setup-mode',m,'choice '+(state.setup.mode===m?'selected':''),`aria-pressed="${state.setup.mode===m}"`)).join('')}</div></div><div class="setup-row"><h3>${u('length')}</h3><div class="choices">${['short','full'].map(m=>actButton(`<strong>${u(m)}</strong><small>${m==='short'?10:CARDS.length} ${u('questions')}</small>`,'setup-length',m,'choice '+(state.setup.length===m?'selected':''),`aria-pressed="${state.setup.length===m}"`)).join('')}</div></div>${state.level>=3?`<p class="setup-notice"><strong>${u('self')}.</strong> ${state.setup.mode==='exam'?u('selfExam'):u('selfHint')}</p>`:''}<div class="setup-footer"><p class="small muted">${u('kind'+state.level)}</p>${actButton(u('start')+' ›','start','','primary')}</div></section>`;}
function pickRound(){if(state.setup.length==='full')return shuffle(CARDS.map(c=>c.id));let ids=[];for(const group of GROUPS){const all=CARDS.filter(c=>cardGroup(c).id===group.id),chosen=[];for(const sid of group.sections){const pool=shuffle(all.filter(c=>c.section===sid));if(pool.length)chosen.push(pool[0].id);}const remaining=shuffle(all.map(c=>c.id).filter(id=>!chosen.includes(id)));ids.push(...chosen,...remaining.slice(0,5-chosen.length));}return shuffle(ids);}
function newQuiz(ids=null,level=state.level,mode=state.setup.mode){
 const order=ids?shuffle(unique(ids)):pickRound(),q={id:String(Date.now()),level,mode,order,index:0,phase:'active',answers:{},optionOrders:{},blockOrders:{},recorded:false};
 for(const id of order){const c=byId[id];q.optionOrders[id]=shuffle(c.mc.options.map(o=>o.id));let blocks=shuffle(c.sentence.blocks.map(b=>b.id));if(JSON.stringify(blocks)===JSON.stringify(c.sentence.orders.gl))blocks.push(blocks.shift());q.blockOrders[id]=blocks;q.answers[id]={choice:null,blocks:[],text:'',oral:false,revealed:false,criteria:[],submitted:false,reviewed:false,score:null};}
 state.quiz=q;state.view='quiz';state.level=level;showAllResults=false;
}
function current(){const q=state.quiz,c=byId[q.order[q.index]],a=q.answers[c.id];return {q,c,a};}
function questionTitle(c,level){return level===1?tr(c.mc.prompt):level===2?u('kind2'):tr(c.open[level].prompt);}
function isReady(q,c,a){return q.level===1?!!a.choice:q.level===2?a.blocks.length===c.sentence.blocks.length:!!(a.text.trim()||a.oral);}
function feedback(q,c,a){if(!a.submitted||q.level>=3)return '';if(q.mode==='exam')return `<div class="feedback neutral" role="status">${u('answerSaved')}</div>`;const good=a.score===1;return `<div class="feedback ${good?'':'incorrect'}" role="status"><h3>${u(good?'correct':'notYet')}</h3>${!good?`<p class="answer-line">${q.level===1?tr(c.mc.options.find(o=>o.id===c.mc.correct).text):sentence(c)}</p>`:''}<p>${q.level===1?tr(c.mc.why):tr(c.explain)}</p></div>`;}
function modelReview(q,c,a){const o=c.open[q.level];return `<section class="self-box"><div class="self-badge">${u('self')}</div><h3>${u('model')}</h3><p class="model">${tr(o.model)}</p><p class="small muted">${u('selfHint')}</p><div class="checklist">${o.criteria.map(k=>`<label class="checkbox-label"><input type="checkbox" data-criterion="${k.id}" ${a.criteria.includes(k.id)?'checked':''} ${a.reviewed?'disabled':''}><span>${tr(k.text)}</span></label>`).join('')}</div><p class="small"><strong>${a.criteria.length} / ${o.criteria.length}</strong> ${u('ideas')}</p></section>`;}
function quiz(){
 const q=state.quiz;if(!q)return setup();if(q.phase==='results')return results();const {c,a}=current(),selfPhase=q.phase==='selfreview',number=q.index+1,submitted=selfPhase?a.reviewed:a.submitted;
 let body='';
 if(q.level===1){body=`<div class="quiz-options" role="group" aria-label="${u('yourAnswer')}">${q.optionOrders[c.id].map((id,i)=>{const o=c.mc.options.find(x=>x.id===id),cls=a.submitted&&q.mode==='practice'?(id===c.mc.correct?' correct':id===a.choice?' incorrect':''):'';return actButton(`<span class="option-letter">${String.fromCharCode(65+i)}</span><span>${tr(o.text)}</span>`,'choose',id,'quiz-option '+(a.choice===id?'selected':'')+cls,`aria-pressed="${a.choice===id}" ${a.submitted?'disabled':''}`);}).join('')}</div>`;}
 else if(q.level===2){body=`<p class="small muted">${u('buildHint')}</p><div class="sentence-box" role="group" aria-label="${u('build')}">${a.blocks.length?a.blocks.map((id,i)=>actButton(tr(c.sentence.blocks.find(b=>b.id===id).text),'remove-block',id,'',a.submitted?'disabled':'')).join(''):`<span class="muted small">${u('emptySentence')}</span>`}</div><div class="sentence-bank">${q.blockOrders[c.id].map(id=>actButton(tr(c.sentence.blocks.find(b=>b.id===id).text),'add-block',id,'',a.submitted||a.blocks.includes(id)?'disabled':'')).join('')}</div><div class="block-tools">${actButton(u('undo'),'undo','','subtle',a.submitted||!a.blocks.length?'disabled':'')}${actButton(u('clear'),'clear-blocks','','subtle',a.submitted||!a.blocks.length?'disabled':'')}</div>`;}
 else if(selfPhase){body=`<p class="self-badge">${u('selfPhase')} · ${u('self')}</p><h3 class="small">${u('yourAnswer')}</h3>${a.text?`<div class="saved-text">${esc(a.text)}</div>`:''}${a.oral?`<p class="small muted">✓ ${u('oral')}</p>`:''}${modelReview(q,c,a)}`;}
 else {body=`<div class="open-answer"><label for="answer-text" class="small">${u('yourAnswer')}</label><textarea id="answer-text" data-text="answer" placeholder="${u('write')}" maxlength="20000" ${a.submitted||a.revealed?'readonly':''}>${esc(a.text)}</textarea><label class="checkbox-label"><input type="checkbox" data-change="oral" ${a.oral?'checked':''} ${a.submitted||a.revealed?'disabled':''}><span>${u('oral')}</span></label><p class="tiny muted">${u('oralHint')}</p></div>${a.revealed?modelReview(q,c,a):''}${a.submitted&&q.mode==='exam'?`<div class="feedback neutral" role="status">${u('answerSaved')}</div>`:''}`;}
 const end=q.index===q.order.length-1;
 let button;
 if(submitted)button=actButton(u(end?(q.level>=3&&q.mode==='exam'&&!selfPhase?'selfPhase':'finish'):'nextQuestion')+' ›','next-question','','primary');
 else if(selfPhase||q.level>=3&&a.revealed)button=actButton(u('saveSelf'),'submit','','primary');
 else if(q.level>=3&&q.mode==='practice')button=actButton(u('reveal'),'reveal','','primary',isReady(q,c,a)?'':'disabled');
 else button=actButton(u(q.mode==='exam'?'saveAnswer':'check'),'submit','','primary',isReady(q,c,a)?'':'disabled');
 return `<section class="surface quiz"><div class="quiz-meta"><span class="pill">${q.level>=3?u('self')+' · ':''}${u(q.mode)}</span><span>${u('question')} ${number} / ${q.order.length}</span></div><div class="progress-track" aria-hidden="true"><span style="width:${(q.index+(submitted?1:0))/q.order.length*100}%"></span></div><h2 tabindex="-1" id="question-heading">${questionTitle(c,q.level)}</h2>${body}${feedback(q,c,a)}<div class="quiz-actions">${actButton(u('newRound'),'view','setup','subtle')}${button}</div></section>`;
}
function totals(q){let score=0,max=0;for(const id of q.order){const a=q.answers[id];score+=Number(a.score)||0;max+=q.level<3?1:byId[id].open[q.level].criteria.length;}return {score,max};}
function errors(q){return q.order.filter(id=>{const a=q.answers[id];return q.level<3?a.score!==1:a.criteria.length<byId[id].open[q.level].criteria.length;});}
function finishQuiz(){const q=state.quiz;q.phase='results';if(!q.recorded){const t=totals(q);state.history.push({date:new Date().toISOString(),level:q.level,mode:q.mode,count:q.order.length,...t});state.history=state.history.slice(-100);q.recorded=true;}if(!errors(q).length)chime();}
function resultCard(id,q,index){const c=byId[id],a=q.answers[id];let answer='',model='',why='';if(q.level===1){answer=tr(c.mc.options.find(o=>o.id===a.choice)?.text||L('—','—','—'));model=tr(c.mc.options.find(o=>o.id===c.mc.correct).text);why=tr(c.mc.why);}else if(q.level===2){answer=sentence(c,state.lang,a.blocks);model=sentence(c);why=tr(c.explain);}else{answer=a.text||u('oral');model=tr(c.open[q.level].model);}
 return `<article class="review-card"><h3>${index+1}. ${questionTitle(c,q.level)}</h3><p class="small muted">${u('yourAnswer')}</p><p class="my-answer" style="white-space:pre-wrap">${esc(answer)}</p><p><strong>${u(q.level>=3?'model':'rightAnswer')}:</strong> ${esc(model)}</p>${why?`<p>${esc(why)}</p>`:`<ul>${c.open[q.level].criteria.map(k=>`<li>${a.criteria.includes(k.id)?'✓':'○'} ${tr(k.text)}</li>`).join('')}</ul>`}${actButton(u('seeNotes'),'card',id,'subtle small')}</article>`;}
function results(){const q=state.quiz,t=totals(q),bad=errors(q),list=showAllResults?q.order:bad;return `<section class="surface quiz"><div class="results-hero"><div class="score-circle"><strong>${t.score}/${t.max}</strong><span>${u(q.level<3?'score':'ideas')}</span></div><div><p class="eyebrow">${u(q.level<3?'objective':'self')}</p><h2>${u('results')}</h2><p class="small muted">${u('step')} ${q.level} · ${levelName(q.level)} · ${q.order.length} ${u('questions')}</p></div></div>${bad.length?`<h3>${u('reviewErrors')}</h3>`:`<p class="notice">✦ ${u('perfect')}</p>`}${q.level>=3?`<p class="small muted">${u('printSelf')}</p>`:''}<div class="results-actions">${bad.length?actButton(u('retry'),'retry','','primary'):actButton(u('new'),'view','setup','primary')}${actButton(u('seeNotes'),'view','study')}${!showAllResults?actButton(u('reviewAll'),'review-all','','subtle'):''}</div>${list.map((id,i)=>resultCard(id,q,i)).join('')}</section>`;}
function printView(){const p=state.print;return `<section class="surface"><p class="eyebrow">A4</p><h2>${u('printTitle')}</h2><p class="muted">${u('printSub')}</p><div class="print-form"><div><label for="print-lang">${u('printLang')}</label><select id="print-lang" data-change="print-lang">${LANGS.map(l=>`<option value="${l}" ${p.lang===l?'selected':''}>${LANG_NAMES[l]}</option>`).join('')}</select></div><div><label for="print-kind">${u('printType')}</label><select id="print-kind" data-change="print-kind">${[['map','map'],['notes','notesForLevel'],['exam','paperExam'],['solutions','solutions']].map(([id,key])=>`<option value="${id}" ${p.kind===id?'selected':''}>${u(key)}</option>`).join('')}</select></div>${p.kind!=='map'?`<div><label for="print-level">${u('step')}</label><select id="print-level" data-change="print-level">${[1,2,3,4].map(n=>`<option value="${n}" ${p.level===n?'selected':''}>${n}. ${levelName(n)}</option>`).join('')}</select></div>`:''}</div><div class="print-info"><h3>${u('printLang')}: ${LANG_NAMES[p.lang]}</h3><p>${u(p.kind==='map'?'printMapHint':p.kind==='notes'?'printNotesHint':'examPrintHint')}</p>${p.kind==='notes'?`<p><strong>${u('step')} ${p.level}: ${levelName(p.level)}</strong></p>`:''}<p class="small muted">${u('paperHint')}</p></div><div class="print-actions">${actButton('▤ '+u('paperAction'),'print','','primary')}${actButton(u(previewOpen?'hidePreview':'preview'),'preview')}</div>${previewOpen?`<div class="print-preview">${printDocument(p)}</div>`:''}</section>`;}

function progressView(){return `<section class="surface"><h2>${u('saveTitle')}</h2><p class="muted">${u('saveInfo')}</p><div class="progress-grid">${[1,2,3,4].map(n=>`<div class="progress-stat"><span>${n}. ${levelName(n)}</span><b>${state.reviewed[n].length}<small class="small muted"> / ${CARDS.length}</small></b><span>${u('reviewed')}</span></div>`).join('')}</div><div class="progress-tools">${actButton('↓ '+u('export'),'export','','primary')}${actButton('↑ '+u('import'),'import')}${actButton('↓ '+u('downloadHTML'),'download-html')}</div><p class="small muted">${u('htmlHint')}</p><input id="progress-file" type="file" accept=".json,application/json" hidden><p class="small muted">${u('importHint')}</p>${notice?`<p class="notice ${noticeError?'error':''}" role="status">${notice}</p>`:''}<label class="checkbox-label"><input type="checkbox" data-change="sound" ${state.sound?'checked':''}><span>${u('sound')} <small class="muted">${u('soundHint')}</small></span></label><h3 style="margin-top:25px">${u('rounds')}: ${state.history.length}</h3>${state.history.length?`<table class="history-table"><thead><tr><th>${u('date')}</th><th>${u('step')}</th><th>${u('mode')}</th><th>${u('results')}</th></tr></thead><tbody>${state.history.slice(-10).reverse().map(h=>`<tr><td>${new Intl.DateTimeFormat(state.lang==='en'?'en-GB':state.lang+'-ES',{dateStyle:'short'}).format(new Date(h.date))}</td><td>${h.level}. ${levelName(h.level)}</td><td>${u(h.mode)}</td><td>${h.score}/${h.max} ${h.level>=3?'· '+u('self'):''}</td></tr>`).join('')}</tbody></table>`:`<p class="muted">${u('noRounds')}</p>`}</section>`;}
function footer(){return `<footer class="footer"><span class="${storageOK?'':'storage-warning'}">● ${u(storageOK?'stored':'notStored')}<br>${u('offline')}</span><div class="footer-actions">${actButton('↓ '+u('downloadHTML'),'download-html','','subtle')}${actButton(u('progress'),'view','progress','subtle')}</div></footer>`;}

function render(){
 save();const active=document.activeElement,focused=active?.id,action=active?.dataset?.action,value=active?.dataset?.value,criterion=active?.dataset?.criterion;
 const selection=focused==='answer-text'?[active.selectionStart,active.selectionEnd]:null;
 document.documentElement.lang=state.lang;document.title=tr(META.title)+' · '+u('lab');
 root.innerHTML=header()+`<main id="main" tabindex="-1">${({study,map:overview,setup,quiz,print:printView,progress:progressView}[state.view]||overview)()}</main>`+footer();
 let target=focused?document.getElementById(focused):null;
 if(!target&&action)target=Array.from(root.querySelectorAll('button[data-action]')).find(el=>el.dataset.action===action&&el.dataset.value===value);
 if(!target&&criterion)target=Array.from(root.querySelectorAll('input[data-criterion]')).find(el=>el.dataset.criterion===criterion);

function focusMain(){const el=document.getElementById('question-heading')||document.getElementById('main');el?.focus({preventScroll:true});el?.scrollIntoView({behavior:'auto',block:'start'});}
function chime(){if(!state.sound)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;const ac=new Audio(),osc=ac.createOscillator(),gain=ac.createGain();osc.type='sine';osc.frequency.setValueAtTime(660,ac.currentTime);osc.frequency.setValueAtTime(880,ac.currentTime+.08);gain.gain.setValueAtTime(.025,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);osc.connect(gain);gain.connect(ac.destination);osc.start();osc.stop(ac.currentTime+.2);osc.onended=()=>ac.close();}catch(e){}}
function downloadProgress(){const blob=new Blob([JSON.stringify({format:'learning-backup',exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vista-oido-progreso-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importProgress(file){try{if(!file||file.size>2*1024*1024)throw Error('size');const next=normalise(JSON.parse(await file.text()));state=next;state.view='progress';state.hidden=false;notice=u('importOK');noticeError=false;}catch(e){notice=u('importError');noticeError=true;}render();}
root.addEventListener('click',event=>{const btn=event.target.closest('button[data-action]');if(!btn||btn.disabled)return;const action=btn.dataset.action,value=btn.dataset.value;let moveFocus=false,returnToConcept=null;

 else if(action==='view'){const oldView=state.view;state.view=value==='challenge'?(state.quiz&&state.quiz.phase!=='results'&&state.quiz.level===state.level?'quiz':'setup'):value;if(value==='print'){if(oldView==='map')state.print.kind='map';else if(['study','quiz','setup'].includes(oldView)){state.print.kind='notes';state.print.level=state.level;}state.print.lang=state.lang;}state.hidden=false;moveFocus=true;}

 else if(action==='map-toggle'){toggleMapBranch(value);}

 else if(action==='download-html'){downloadHTML();return;}
 else if(action==='card'){state.cardId=value;state.view='study';state.hidden=false;moveFocus=true;}
 else if(action==='move'){const n=CARDS.findIndex(c=>c.id===state.cardId)+Number(value);if(n>=0&&n<CARDS.length)state.cardId=CARDS[n].id;state.hidden=false;}
 else if(action==='hide')state.hidden=!state.hidden;
 else if(action==='mark'){const ids=state.reviewed[state.level];state.reviewed[state.level]=ids.includes(state.cardId)?ids.filter(id=>id!==state.cardId):[...ids,state.cardId];}
 else if(action==='setup-mode')state.setup.mode=value;
 else if(action==='setup-length')state.setup.length=value;
 else if(action==='start'){newQuiz();moveFocus=true;}
 else if(action==='resume'){state.view='quiz';moveFocus=true;}
 else if(action==='choose'){const {a}=current();if(!a.submitted)a.choice=value;}

 else if(action==='reveal'){const {q,c,a}=current();if(isReady(q,c,a))a.revealed=true;}
 else if(action==='submit'){const {q,c,a}=current();if(q.phase==='selfreview'||q.level>=3&&a.revealed){a.reviewed=true;a.submitted=true;a.score=a.criteria.length;}
  else if(isReady(q,c,a)){a.submitted=true;if(q.level===1)a.score=a.choice===c.mc.correct?1:0;else if(q.level===2)a.score=JSON.stringify(a.blocks)===JSON.stringify(c.sentence.orders[state.lang])?1:0;}

 }
 else if(action==='next-question'){const {q,a}=current();if(q.phase==='selfreview'?!a.reviewed:!a.submitted)return;if(q.index<q.order.length-1){q.index++;moveFocus=true;}else if(q.level>=3&&q.mode==='exam'&&q.phase==='active'){q.phase='selfreview';q.index=0;moveFocus=true;}else{finishQuiz();moveFocus=true;}}
 else if(action==='retry'){const q=state.quiz;newQuiz(errors(q),q.level,'practice');moveFocus=true;}

 render();if(returnToConcept){Array.from(root.querySelectorAll('[data-action="map-concept"]')).find(el=>el.dataset.value===returnToConcept)?.focus({preventScroll:true});}if(moveFocus)focusMain();else if(action==='map-concept'&&state.map.detail){const target=document.getElementById('map-detail-heading');target?.focus({preventScroll:true});target?.scrollIntoView({behavior:'auto',block:'nearest'});}
});
root.addEventListener('input',event=>{if(event.target.dataset.text==='answer'){const {a}=current();if(!a.submitted&&!a.revealed){a.text=event.target.value;save();const button=root.querySelector('[data-action="reveal"],[data-action="submit"]');if(button){const {q,c}=current();button.disabled=!isReady(q,c,a);}}}});
root.addEventListener('change',event=>{const el=event.target;if(el.id==='progress-file'){importProgress(el.files[0]);return;}if(el.dataset.criterion){const {a}=current();if(!a.reviewed){a.criteria=el.checked?unique([...a.criteria,el.dataset.criterion]):a.criteria.filter(x=>x!==el.dataset.criterion);}render();return;}switch(el.dataset.change){case 'card':state.cardId=el.value;state.hidden=false;break;case 'oral':current().a.oral=el.checked;break;case 'sound':state.sound=el.checked;break;case 'print-lang':state.print.lang=el.value;break;case 'print-kind':state.print.kind=el.value;break;case 'print-level':state.print.level=Number(el.value);break;default:return;}render();});
window.addEventListener('beforeprint',()=>{document.getElementById('print-root').innerHTML=printDocument(state.view==='print'?state.print:{kind:state.view==='map'?'map':'notes',level:state.level,lang:state.lang});});
window.addEventListener('beforeunload',save);

function braceSVG(className='map-brace'){return `<svg class="${className}" viewBox="0 0 16 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M14 1 C6 1 8 12 8 25 C8 42 2 43 2 50 C2 57 8 58 8 75 C8 88 6 99 14 99" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;}
function mapTreeNode(node,depth=0){
 const branch=!!node.children?.length,opened=state.map.expanded.includes(node.id),selected=state.map.detail?.nodeId===node.id;
 const button=branch?`<button class="map-node-button branch-button ${depth===0?'major-branch':''}" data-action="map-toggle" data-value="${node.id}" aria-expanded="${opened}" aria-controls="children-${node.id}"><span class="map-disclosure" aria-hidden="true">${opened?'−':'+'}</span><span>${esc(tr(node.title))}</span></button>`:`<button class="map-node-button concept-button ${selected?'selected':''}" data-action="map-concept" data-value="${node.id}" aria-pressed="${selected}" aria-controls="map-concept-panel"><span>${esc(tr(node.title))}</span></button>`;
 return `<li class="map-node ${branch?'map-group':'map-concept'}" data-node-id="${node.id}">${button}${branch?`<div class="map-children" id="children-${node.id}" ${opened?'':'hidden'}>${braceSVG()}<ul class="map-list">${opened?node.children.map(c=>mapTreeNode(c,depth+1)).join(''):''}</ul></div>`:''}</li>`;
}
function mapDetailContent(node,level){
 if(level===0)return '';
 if(node.cardId)return textFor(byId[node.cardId],level);
 const extra=MAP_EXTRAS[node.extraId];if(!extra)return '';
 if(level===1)return `<ul class="keywords">${tr(extra.keywords).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
 return `<p>${esc(tr(extra[level===2?'sentence':level===3?'explain':'relate']))}</p>`;
}
function mapDetail(){
 const detail=state.map.detail;if(!detail)return '';const node=MAP_INDEX[detail.nodeId],level=detail.level,id=node.cardId||node.linkedCardId;
 const path=MAP_PATH[node.id].slice(1,-1).map(n=>`<span>${esc(tr(n.title))}</span>`).join('<span class="crumb-separator" aria-hidden="true">›</span>');
 return `<section class="map-detail" id="map-concept-panel" aria-labelledby="map-detail-heading"><div class="map-detail-top"><div class="map-detail-crumb">${path}</div>${actButton(u('namesOnly'),'map-close-detail','','subtle small')}</div><h2 id="map-detail-heading" tabindex="-1">${esc(tr(node.title))}</h2><div class="map-depths" role="group" aria-label="${u('deepening')}">${[0,1,2,3,4].map(n=>actButton(u('mapLevel'+n),'map-level',String(n),n===level?'active':'',`aria-pressed="${n===level}"`)).join('')}</div>${level?`<div class="map-detail-text">${mapDetailContent(node,level)}</div>`:''}<div class="map-detail-actions">${actButton('‹ '+u('previous'),'map-level',String(level-1),'subtle',level===0?'disabled':'')}${level<4?actButton(u('next')+': '+u('mapLevel'+(level+1))+' ›','map-level',String(level+1),'primary'):''}</div>${id?`<div class="map-card-link">${actButton(u('openCard')+': '+esc(tr(byId[id].title)),'map-open-card',id,'subtle')}</div>`:''}</section>`;
}
function overview(){return `<section class="surface mental-map"><div class="map-toolbar" role="group" aria-label="${u('mapControls')}">${actButton(u('expandMap'),'map-expand-all','','primary')}${actButton(u('closeAll'),'map-close-all','','subtle')}${actButton('▤ '+u('printMap'),'print-map','','subtle')}</div><div class="map-tree" aria-label="${u('map')}"><div class="map-root-name">${esc(tr(MENTAL_MAP.title))}</div><div class="map-root-branches">${braceSVG('map-root-brace')}<ul class="map-list">${MENTAL_MAP.children.map(node=>mapTreeNode(node)).join('')}</ul></div></div>${mapDetail()}</section>`;}
function downloadHTML(){
 const copy=document.documentElement.cloneNode(true);
 for(const id of ['app','print-root']){const element=copy.querySelector('#'+id);if(element)element.innerHTML='';}
 copy.setAttribute('lang','gl');const title=copy.querySelector('title');if(title)title.textContent=META.title.gl+' · '+UI.lab.gl;
 const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download='vista-e-oido.html';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function chunk(arr,size){const out=[];for(let i=0;i<arr.length;i+=size)out.push(arr.slice(i,i+size));return out;}
function paperShuffle(arr,seed){let n=0;for(const char of seed)n=(n*31+char.charCodeAt(0))>>>0;const a=arr.slice();for(let i=a.length-1;i>0;i--){n=(Math.imul(1664525,n)+1013904223)>>>0;const j=n%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function printHeader(p){
 const lang=p.lang,type={map:'mapType',notes:'notesLevelType',exam:'examType',solutions:'solutionsType'}[p.kind];
 return `<header class="print-header"><div><h1>${esc(tr(META.title,lang))}</h1><div class="print-meta">${LANG_NAMES[lang]}</div></div><div class="print-label">${u(type,lang)}${p.kind!=='map'?`<br>${u('step',lang)} ${p.level} · ${levelName(p.level,lang)}`:''}</div></header>`;
}
function paperTreeNode(node,lang){
 const children=node.children||[];
 return `<div class="paper-node ${children.length?'paper-group':'paper-leaf'}" data-map-node="${esc(node.id)}"><div class="paper-label">${esc(tr(node.title,lang))}</div>${children.length?`<div class="paper-children"><svg class="paper-brace" viewBox="0 0 16 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M14 1 C6 1 8 12 8 25 C8 42 2 43 2 50 C2 57 8 58 8 75 C8 88 6 99 14 99" fill="none" stroke="currentColor" stroke-width="1.3" vector-effect="non-scaling-stroke"/></svg>${children.map(child=>paperTreeNode(child,lang)).join('')}</div>`:''}</div>`;
}
function printOverview(p){
 return `<div class="paper-tree"><div class="paper-root-label">${esc(tr(MENTAL_MAP.title,p.lang))}</div><div class="paper-branches">${MENTAL_MAP.children.map(node=>`<section class="paper-branch">${paperTreeNode(node,p.lang)}</section>`).join('')}</div></div>`;
}
function paperCardRecords(){
 const records=[];
 function visit(node,path){const next=[...path,node];if(node.cardId&&byId[node.cardId])records.push({card:byId[node.cardId],path:next});for(const child of node.children||[])visit(child,next);}
 visit(MENTAL_MAP,[]);return records;
}
function printCard(record,p){
 const c=record.card,lang=p.lang;
 let body='';
 if(p.level===1)body=`<ul class="print-keywords">${tr(c.keywords,lang).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
 else if(p.level===2)body=`<p>${esc(sentence(c,lang))}</p>`;
 else body=`<p>${esc(tr(p.level===3?c.explain:c.relate,lang))}</p>`;
 const parents=record.path.slice(1,-1).map(node=>esc(tr(node.title,lang))).join(' › ');
 return `<article class="print-card" data-card-id="${c.id}"><p class="print-crumb">${parents}</p><h3>${esc(tr(c.title,lang))}</h3><div class="print-card-body"><figure aria-label="${esc(tr(c.title,lang))}">${ART[c.art]}</figure><div class="print-text">${body}</div></div></article>`;
}
function paperPrompt(c,level,lang){return level===1?tr(c.mc.prompt,lang):level===2?u('paperSentence',lang):tr(c.open[level].prompt,lang);}
function printQuestion(c,index,p){
 const lang=p.lang,level=p.level;let content='';
 if(level===1){const opts=paperShuffle(c.mc.options,c.id+'mc');content=`<ol class="print-options" type="A">${opts.map(o=>`<li>${esc(tr(o.text,lang))}</li>`).join('')}</ol>`;}
 else if(level===2){let ids=paperShuffle(c.sentence.orders[lang],c.id+'sentence');if(JSON.stringify(ids)===JSON.stringify(c.sentence.orders[lang]))ids.push(ids.shift());content=`<div class="print-blocks">${ids.map((id,i)=>`<b>${String.fromCharCode(65+i)}.</b> ${esc(tr(c.sentence.blocks.find(b=>b.id===id).text,lang))}`).join(' &nbsp; | &nbsp; ')}</div><div class="answer-lines"></div>`;}
 else content='<div class="answer-lines large"></div>';
 return `<article class="print-question" data-question-id="${c.id}"><h3>${index+1}. ${esc(paperPrompt(c,level,lang))}</h3>${content}</article>`;
}
function printSolution(c,index,p){
 const lang=p.lang,level=p.level;let content='';
 if(level===1){const opts=paperShuffle(c.mc.options,c.id+'mc'),correct=c.mc.options.find(o=>o.id===c.mc.correct);content=`<p><b>${String.fromCharCode(65+opts.findIndex(o=>o.id===correct.id))}. ${esc(tr(correct.text,lang))}</b></p><p>${esc(tr(c.mc.why,lang))}</p>`;}
 else if(level===2)content=`<p><b>${esc(sentence(c,lang))}</b></p><p>${esc(tr(c.explain,lang))}</p>`;
 else{const o=c.open[level];content=`<p><b>${u('model',lang)}:</b> ${esc(tr(o.model,lang))}</p><ul>${o.criteria.map(k=>`<li>□ ${esc(tr(k.text,lang))}</li>`).join('')}</ul>`;}
 return `<article class="print-question print-answer" data-question-id="${c.id}"><h3>${index+1}. ${esc(paperPrompt(c,level,lang))}</h3>${content}</article>`;
}
function printDocument(options){
 const p={...options},raw=[];
 if(!['map','notes','exam','solutions'].includes(p.kind))p.kind='notes';
 if(![1,2,3,4].includes(p.level))p.level=1;
 if(!LANGS.includes(p.lang))p.lang=state.lang;
 const lang=p.lang;
 if(p.kind==='map'||p.kind==='notes'){
  raw.push({content:printOverview(p),className:'mental-map-page'});
  if(p.kind==='notes'){
   const records=paperCardRecords(),compact=p.level<=2;
   for(const group of MENTAL_MAP.children){
    const members=records.filter(r=>r.path[1].id===group.id),pages=chunk(members,compact?6:4);
    pages.forEach((page,i)=>raw.push({className:compact?'compact':'',content:`<h2>${esc(tr(group.title,lang))} · ${i+1}/${pages.length}</h2><div class="print-cards">${page.map(record=>printCard(record,p)).join('')}</div>`}));
   }
  }
 }else{
  const solution=p.kind==='solutions',size=solution?(p.level<3?6:3):(p.level===1?6:4),pages=chunk(CARDS,size);
  pages.forEach((page,i)=>raw.push({className:'exam-page',content:`${i===0?`${solution?`<p class="print-intro">${u(p.level>=3?'printSelf':'solutions',lang)}</p>`:`<div class="print-name"><span>${u('name',lang)}: __________________________</span><span>${u('date',lang)}: ______________</span></div><p class="print-intro">${u('paperInstructions'+Math.min(p.level,3),lang)}</p>`}`:''}<div class="print-questions">${page.map((c,j)=>solution?printSolution(c,i*size+j,p):printQuestion(c,i*size+j,p)).join('')}</div>`}));
 }
 return raw.map((r,i)=>`<section class="print-page ${r.className}" lang="${lang}">${printHeader(p)}${r.content}<footer class="print-footer">${u('page',lang)} ${i+1} / ${raw.length} · ${LANG_NAMES[lang]}</footer></section>`).join('');
}
render();
</script>
</body>
</html>
